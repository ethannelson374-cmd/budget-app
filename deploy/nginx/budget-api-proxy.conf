# Deliberately omit a URI suffix from proxy_pass. Nginx therefore forwards the
# complete /api/... request path to FastAPI without stripping the /api prefix.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_redirect off;
proxy_intercept_errors off;
# API query strings can contain private financial filters. The application
# emits a request-id-correlated method/path/status log without query values.
access_log off;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite, rather than append to, the client-supplied value. Uvicorn trusts
# only this loopback Nginx peer.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Server;
add_header Cache-Control "no-store" always;
add_header X-Request-ID "$request_id" always;
include /etc/nginx/snippets/budget-security-headers.conf;
