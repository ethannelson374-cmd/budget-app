# Temporary HTTP-only site used to serve the built frontend and complete an
# ACME HTTP-01 challenge. It intentionally refuses setup, login, and all other
# non-health API traffic because the bootstrap token must travel only over TLS.
# Enable this file OR budget-https.conf, never both.

map $https $budget_hsts {
    default "";
    on      "max-age=31536000";
}

server {
    listen 80;
    listen [::]:80;
    server_name budget.example.com;

    root /opt/budget-app/current/frontend/dist;
    index index.html;
    server_tokens off;
    # Avoid retaining request targets or query strings, including accidental
    # secret values, anywhere in the supplied Budget site configuration.
    access_log off;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    include /etc/nginx/snippets/budget-security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/ready {
        access_log off;
        return 404;
    }

    location = /api/ready/ {
        access_log off;
        return 404;
    }

    location = /api/health {
        include /etc/nginx/snippets/budget-api-proxy.conf;
    }

    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID "$request_id" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
        return 426 '{"error":{"code":"https_required","message":"Use HTTPS for this API.","request_id":"$request_id"}}';
    }

    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID "$request_id" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
        return 426 '{"error":{"code":"https_required","message":"Use HTTPS for this API.","request_id":"$request_id"}}';
    }

    # Vite emits content-hashed files below /assets/.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
        access_log off;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
    }
}
