# Final same-origin production site. Replace budget.example.com and the
# certificate paths before enabling it. Enable this file OR the bootstrap HTTP
# template, never both.

map $https $budget_hsts {
    default "";
    on      "max-age=31536000";
}

limit_req_zone $binary_remote_addr zone=budget_setup_per_ip:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=budget_login_per_ip:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name budget.example.com;

    server_tokens off;
    # Do not retain request targets or query strings in an access log. Secrets
    # belong in headers/body, but this keeps accidental query values out too.
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never redirect an API request: a redirect can replay an unsafe request
    # and its body. Clients must retry explicitly over HTTPS.
    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID "$request_id" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
        return 426 '{"error":{"code":"https_required","message":"Use HTTPS for this API.","request_id":"$request_id"}}';
    }

    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID "$request_id" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
        return 426 '{"error":{"code":"https_required","message":"Use HTTPS for this API.","request_id":"$request_id"}}';
    }

    location / {
        return 308 https://budget.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name budget.example.com;

    root /opt/budget-app/current/frontend/dist;
    index index.html;
    server_tokens off;
    access_log off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/budget.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BUDGET_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    include /etc/nginx/snippets/budget-security-headers.conf;

    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @budget_rate_limited;

    # Readiness may reveal dependency state. It is available directly at
    # 127.0.0.1:8000/api/ready but never through public Nginx.
    location = /api/ready {
        access_log off;
        return 404;
    }

    location = /api/ready/ {
        access_log off;
        return 404;
    }

    location = /api/v1/setup {
        limit_req zone=budget_setup_per_ip burst=2 nodelay;
        include /etc/nginx/snippets/budget-api-proxy.conf;
    }

    location = /api/v1/auth/login {
        limit_req zone=budget_login_per_ip burst=5 nodelay;
        include /etc/nginx/snippets/budget-api-proxy.conf;
    }

    location = /api {
        include /etc/nginx/snippets/budget-api-proxy.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/budget-api-proxy.conf;
    }

    location @budget_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Request-ID "$request_id" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests.","request_id":"$request_id"}}';
    }

    # Vite emits content-hashed files below /assets/.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
        access_log off;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/budget-security-headers.conf;
    }
}
